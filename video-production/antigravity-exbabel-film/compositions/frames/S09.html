<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Sora';
      src: url('assets/Sora.ttf') format('truetype');
      font-weight: 100 800;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Sora', sans-serif;
      background: #FCFCFD;
    }
    .scene {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Camera wrapper for product-focus zoom */
    .camera-viewport {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform-origin: center center;
    }
    /* Brand colors */
    :root {
      --blue: #4338ca;
      --ink: #1a1a2e;
      --emerald: #10b981;
      --bg: #FCFCFD;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
    }
    .headline {
      font-size: 48px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      line-height: 1.3;
      max-width: 1200px;
    }
    .subline {
      font-size: 24px;
      font-weight: 400;
      color: var(--gray-500);
      text-align: center;
      max-width: 900px;
      margin-top: 16px;
    }
    .brand-mark {
      width: 64px;
      height: 64px;
    }
    /* UI embed container */
    .ui-frame {
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(37, 75, 217, 0.12),
                  0 8px 20px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      background: #fff;
    }
    /* Fade-in utility */
    .fade-element {
      opacity: 0;
      transform: translateY(20px);
    }
  </style>
</head>
<body>
  <div id="S09-root"
       data-composition-id="S09"
       data-width="1920"
       data-height="1080"
       data-duration="5.188"
       style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#FCFCFD;">


  <div class="scene">
    <div class="camera-viewport" id="camera"
         style="display:flex; align-items:center; justify-content:center;
                transform-origin: 50% 50%;">
      <div id="ui-wrapper" class="ui-frame fade-element"
           style="display:flex; align-items:center; justify-content:center;">
        <iframe src="assets/translate-mobile-listener.html"
                style="width:360px; height:auto; border-radius:20px; border:none; pointer-events:none;"
                scrolling="no"></iframe>
      </div>
    </div>
    <div id="vo-text" class="fade-element"
         style="position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
                font-size:20px; color:var(--gray-500); text-align:center;
                max-width:800px; line-height:1.5;">
      They can also read translated captions right on their phone.
    </div>
  </div>

  <script src="assets/anime.umd.min.js"></script>
  <script>
    'use strict';
    const tl = anime.createTimeline({
      autoplay: false,
      easing: 'easeOutCubic'
    });
    
    // Establish
    tl.add('#ui-wrapper', { opacity: [0,1], translateY: [30,0], duration: 400 }, 0)
      tl.add('#vo-text', { opacity: [0,1], translateY: [10,0], duration: 500 }, 200)
      // Push-in (product-focus-camera: scale + translate)
      tl.add('#camera', { scale: [1, 2.0],
              translateX: [0, 0],
              translateY: [0, 0],
              duration: 600,
              easing: 'cubicBezier(0.22, 1, 0.36, 1)' }, 400)
      // Pull-back
      tl.add('#camera', { scale: [2.0, 1.05],
              translateX: [0, 0],
              translateY: [0, 0],
              duration: 350,
              easing: 'easeInOutCubic' }, 4788);
    
    window.__timelines = window.__timelines || {};
    window.__timelines[document.body.dataset.compositionId] = {
      seek: (ms) => tl.seek(ms),
      duration: 5188
    };
    if (typeof window.storyboardTimeline === 'undefined') {
      window.storyboardTimeline = { seek: (ms) => tl.seek(ms) };
    }
  </script>

  </div>
</body>
</html>
