<script>
window.__timelines = window.__timelines || {};
(function() {
const tl = gsap.timeline({ paused: true });

function wrapWords(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  // Ensure the container is visible and doesn't interfere
  el.style.opacity = '1'; 
  el.style.transform = 'none';
  // Hide parent before GSAP kicks in if needed, but the words are opacity 0 so it's fine.
  // Actually, we need to make sure GSAP doesn't override this with initial sets.
  gsap.set(el, { opacity: 1, y: 0, x: 0, scale: 1 });
  
  const wrapNode = (node) => {
    if (node.nodeType === 3) {
      const words = node.nodeValue.split(/(\s+)/);
      const frag = document.createDocumentFragment();
      let hasContent = false;
      words.forEach(w => {
        if (!w.trim()) {
          frag.appendChild(document.createTextNode(w));
        } else {
          hasContent = true;
          const mask = document.createElement("span");
          mask.style.cssText = "display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 15px; margin-bottom: -15px;";
          const inner = document.createElement("span");
          // start state:
          inner.style.cssText = "display: inline-block; transform: translateY(45px) scale(0.98); opacity: 0;";
          inner.className = "hf-word";
          inner.innerText = w;
          mask.appendChild(inner);
          frag.appendChild(mask);
        }
      });
      if (hasContent) {
        node.parentNode.replaceChild(frag, node);
      }
    } else if (node.nodeType === 1) {
      if (node.tagName.toLowerCase() !== 'br' && !node.classList.contains('hf-word')) {
        Array.from(node.childNodes).forEach(wrapNode);
      }
    }
  };
  Array.from(el.childNodes).forEach(wrapNode);
}

wrapWords(".s05-text");
tl.to(".s05-text .hf-word", { y: 0, opacity: 1, scale: 1, duration: 0.45, stagger: 0.08, ease: "power3.out" }, 0.2);


// tl.set(".s05-text", { y: 20, opacity: 0 });
// SPATIAL ENTRANCE: Match S04 push through by flying in from massive scale
tl.set(".s05-join", { opacity: 0, scale: 4, y: 300 });
tl.set(".s05-pointer", { opacity: 0, x: 80, y: 80 });

// Text appears
// tl.to(".s05-text", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.2);

// Text fades out
tl.to(".s05-text", { y: -20, opacity: 0, duration: 0.6, ease: "power3.in" }, 1.4);

// Phone appears
tl.to(".s05-join", { opacity: 1, scale: 1, y: 0, duration: 1.2, ease: "power3.out" }, 1.7);

// Move pointer in
tl.to(".s05-pointer", { opacity: 1, duration: 0.3 }, 2.5);
tl.to(".s05-pointer", { x: 0, y: 0, duration: 0.8, ease: "power3.out" }, 2.5);

// Simulate Click
tl.to(".s05-ring", { scale: 3, opacity: 0, duration: 0.5, ease: "power2.out" }, 3.3);
tl.to(".s05-pointer", { scale: 0.8, duration: 0.1, yoyo: true, repeat: 1 }, 3.3);
tl.to(".s05-btn", { fill: "#3730a3", duration: 0.1, yoyo: true, repeat: 1 }, 3.3);

// Push in slightly (morph/swap to S06)
tl.to(".s05-camera", { scale: 1.5, y: -40, duration: 1.2, ease: "power3.inOut" }, 3.8);

// SPATIAL EXIT: Phone drops down out of frame
tl.to(".s05-camera", { y: 1500, scale: 1.2, opacity: 0, duration: 1.0, ease: "power3.in" }, 5.2);

window.__timelines["S05"] = tl;
})();
</script>
