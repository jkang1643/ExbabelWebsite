<template id="S18">
  <div data-layout-allow-overlap="true" data-composition-id="S18" data-width="1920" data-height="1080" style="position: absolute; inset: 0; overflow: hidden; background: #f8fafc;">
    
    <!-- Massive Camera Wrapper -->
    <!-- transform-origin is set precisely to the center of the QR code on the church projector screen -->
    <div class="s18-camera" style="position: absolute; width: 1920px; height: 1080px; transform-origin: 960px 250px;">
      
      <svg width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs>
          <!-- Congregation Member -->
          <g id="s18-person">
            <circle cx="0" cy="-30" r="22" fill="#94a3b8" />
            <path d="M -35 30 C -35 -5, 35 -5, 35 30 Z" fill="#64748b" />
          </g>
          <g id="s18-person-light">
            <circle cx="0" cy="-28" r="20" fill="#cbd5e1" />
            <path d="M -30 30 C -30 0, 30 0, 30 30 Z" fill="#94a3b8" />
          </g>
        </defs>

        <!-- Floor -->
        <rect y="400" width="1920" height="680" fill="#e2e8f0" />
        
        <!-- Stage -->
        <path d="M 0 550 L 1920 550 L 1920 450 Q 960 400 0 450 Z" fill="#cbd5e1" />
        
        <!-- Projector Screen -->
        <rect x="760" y="80" width="400" height="340" fill="#1e293b" rx="12" />
        <!-- Screen Glow/Display area -->
        <rect x="770" y="90" width="380" height="320" fill="#ffffff" rx="6" />
        
        <!-- QR Code on the Projector Screen -->
        <g class="s18-qr" transform="translate(860, 150)">
          <!-- This is perfectly aligned at center 960, 250 -->
          <rect x="0" y="0" width="200" height="200" fill="#f8f9fa" stroke="#e5e7eb" rx="10" />
          <rect x="10" y="10" width="40" height="40" fill="#1a1a2e" rx="4" />
          <rect x="18" y="18" width="24" height="24" fill="#fff" rx="2" />
          <rect x="24" y="24" width="12" height="12" fill="#1a1a2e" />
          
          <rect x="150" y="10" width="40" height="40" fill="#1a1a2e" rx="4" />
          <rect x="158" y="18" width="24" height="24" fill="#fff" rx="2" />
          <rect x="164" y="24" width="12" height="12" fill="#1a1a2e" />
          
          <rect x="10" y="150" width="40" height="40" fill="#1a1a2e" rx="4" />
          <rect x="18" y="158" width="24" height="24" fill="#fff" rx="2" />
          <rect x="24" y="164" width="12" height="12" fill="#1a1a2e" />
          
          <!-- Random dots representing the code -->
          <rect x="70" y="20" width="15" height="15" fill="#1a1a2e" />
          <rect x="110" y="40" width="15" height="15" fill="#1a1a2e" />
          <rect x="90" y="80" width="15" height="15" fill="#1a1a2e" />
          <rect x="130" y="100" width="15" height="15" fill="#1a1a2e" />
          <rect x="40" y="90" width="15" height="15" fill="#1a1a2e" />
          <rect x="70" y="140" width="15" height="15" fill="#1a1a2e" />
          <rect x="150" y="120" width="15" height="15" fill="#1a1a2e" />
          <rect x="100" y="160" width="15" height="15" fill="#1a1a2e" />
          <rect x="130" y="170" width="15" height="15" fill="#1a1a2e" />
        </g>

        <!-- Pastor on Stage -->
        <g class="s18-pastor" transform="translate(650, 320)">
          <circle cx="50" cy="30" r="25" fill="#334155" />
          <path d="M 10 160 C 10 70, 90 70, 90 160 Z" fill="#1e293b" />
          <!-- Waving arm -->
          <path class="s18-arm" d="M 80 90 Q 130 50 140 10" stroke="#1e293b" stroke-width="15" stroke-linecap="round" fill="none" transform-origin="80px 90px" />
        </g>

        <!-- Pews and Congregation -->
        <g class="s18-pews">
          <!-- Back Row -->
          <rect x="200" y="650" width="1520" height="30" fill="#94a3b8" rx="8" />
          <use href="#s18-person" x="300" y="640" class="s18-p" />
          <use href="#s18-person-light" x="450" y="645" class="s18-p" />
          <use href="#s18-person" x="600" y="642" class="s18-p" />
          <use href="#s18-person-light" x="1200" y="640" class="s18-p" />
          <use href="#s18-person" x="1400" y="645" class="s18-p" />
          <use href="#s18-person-light" x="1600" y="642" class="s18-p" />
          
          <!-- Middle Row -->
          <rect x="100" y="800" width="1720" height="40" fill="#64748b" rx="10" />
          <use href="#s18-person-light" x="250" y="790" class="s18-p" />
          <use href="#s18-person" x="500" y="795" class="s18-p" />
          <use href="#s18-person-light" x="750" y="792" class="s18-p" />
          <use href="#s18-person" x="1100" y="790" class="s18-p" />
          <use href="#s18-person-light" x="1350" y="795" class="s18-p" />
          <use href="#s18-person" x="1650" y="792" class="s18-p" />

          <!-- Front Row (Closest) -->
          <rect x="0" y="1000" width="1920" height="60" fill="#475569" rx="12" />
          <use href="#s18-person" x="150" y="990" class="s18-p" />
          <use href="#s18-person-light" x="400" y="995" class="s18-p" />
          
          <!-- The highlighted member we will zoom into in S18b -->
          <g id="s18-focus-member" transform="translate(800, 992)">
             <circle cx="0" cy="-30" r="22" fill="#394dfe" /> <!-- Highlighted in brand color for visibility -->
             <path d="M -35 30 C -35 -5, 35 -5, 35 30 Z" fill="#2939e6" />
          </g>

          <use href="#s18-person-light" x="1300" y="990" class="s18-p" />
          <use href="#s18-person" x="1750" y="995" class="s18-p" />
        </g>
      </svg>
      
    </div>
    
<script>
window.__timelines = window.__timelines || {};

// INITIAL STATES
gsap.set(".s18-camera", { scale: 18 }); // Starts massively zoomed in on the QR code
gsap.set(".s18-arm", { rotation: 0 });

const tl = gsap.timeline({ paused: true });
window.__timelines["S18"] = tl;

const DURATION = 1.956; // Shortened S18 duration

// CONTINUOUS MATCH CUT ZOOM OUT
tl.to(".s18-camera", { 
  scale: 1, 
  duration: DURATION - 0.6, // Pull out finishes before the push-in starts
  ease: "power3.out" 
}, 0.0);

// Gentle bobbing motion
tl.to(".s18-p", { 
  y: "-=5", 
  duration: 0.8, 
  yoyo: true, 
  repeat: 1, 
  ease: "sine.inOut", 
  stagger: 0.1 
}, 0.0);

// Pastor waves arm
tl.to(".s18-arm", { 
  rotation: 20, 
  duration: 0.4, 
  yoyo: true, 
  repeat: 4, 
  ease: "sine.inOut" 
}, 0.2);

// DIVE IN
tl.to(".s18-camera", {
  scale: 4,
  x: -2400, // shifting the camera left to center on x=800
  y: -2600, // shifting the camera up to center on y=992
  duration: 0.6,
  ease: "power2.in"
}, DURATION - 0.6);

</script>
  </div>
</template>
