<script>
window.__timelines = window.__timelines || {};
(function() {
const tl = gsap.timeline({ paused: true });

function wrapWords(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  // Ensure the container is visible and doesn't interfere
  el.style.opacity = '1'; 
  el.style.transform = 'none';
  // Hide parent before GSAP kicks in if needed, but the words are opacity 0 so it's fine.
  // Actually, we need to make sure GSAP doesn't override this with initial sets.
  gsap.set(el, { opacity: 1, y: 0, x: 0, scale: 1 });
  
  const wrapNode = (node) => {
    if (node.nodeType === 3) {
      const words = node.nodeValue.split(/(\s+)/);
      const frag = document.createDocumentFragment();
      let hasContent = false;
      words.forEach(w => {
        if (!w.trim()) {
          frag.appendChild(document.createTextNode(w));
        } else {
          hasContent = true;
          const mask = document.createElement("span");
          mask.style.cssText = "display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 15px; margin-bottom: -15px;";
          const inner = document.createElement("span");
          // start state:
          inner.style.cssText = "display: inline-block; transform: translateY(45px) scale(0.98); opacity: 0;";
          inner.className = "hf-word";
          inner.innerText = w;
          mask.appendChild(inner);
          frag.appendChild(mask);
        }
      });
      if (hasContent) {
        node.parentNode.replaceChild(frag, node);
      }
    } else if (node.nodeType === 1) {
      if (node.tagName.toLowerCase() !== 'br' && !node.classList.contains('hf-word')) {
        Array.from(node.childNodes).forEach(wrapNode);
      }
    }
  };
  Array.from(el.childNodes).forEach(wrapNode);
}

wrapWords(".s07-text");
tl.to(".s07-text .hf-word", { y: 0, opacity: 1, scale: 1, duration: 0.45, stagger: 0.08, ease: "power3.out" }, 0.2);


// tl.set(".s07-text", { y: -20, opacity: 0 });
tl.set(".s07-pastor-graphic", { y: 100, opacity: 0, scale: 0.9 });
tl.set(".s07-exbabel", { scale: 0, opacity: 0 });
tl.set(".s07-tb", { scale: 0, opacity: 0, x: -20 });
tl.set(".s07-camera", { scale: 1, x: 0, opacity: 1 });

// tl.to(".s07-text", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.2);

// Pastor enters

// Pastor's arms animate subtly (preaching gesture)
tl.to(".s07-arm", { rotation: "+=15", duration: 1.5, yoyo: true, repeat: 10, ease: "sine.inOut" }, 1.0);
tl.to(".s07-head", { rotation: 5, duration: 2.0, yoyo: true, repeat: 10, ease: "sine.inOut" }, 1.0);

// Sound waves start playing
tl.fromTo(".sw", 
    { scaleY: 0.2 }, 
    { scaleY: 1.2, duration: 0.4, stagger: { amount: 0.4, from: "center", yoyo: true, repeat: 10 }, ease: "sine.inOut" }, 
1.5);

// Exbabel translation node pops in
tl.to(".s07-exbabel", { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.5)" }, 2.5);

// Translation bubbles pop out from Exbabel
tl.to(".tb1", { scale: 1, opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.2)" }, 3.0);
tl.to(".tb2", { scale: 1, opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.2)" }, 3.2);
tl.to(".tb3", { scale: 1, opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.2)" }, 3.4);

// Subtle continuous zoom on the whole camera
tl.to(".s07-camera", { scale: 1.1, duration: 4.5, ease: "none" }, 3.5);

// SPATIAL EXIT: Whip Pan Right (camera moves left -> objects move left off screen)

tl.to(".s07-text", { x: -500, opacity: 0, duration: 0.8, ease: "power3.in" }, 8.0);

window.__timelines["S07"] = tl;
})();
