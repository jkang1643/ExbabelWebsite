<svg
        viewBox="0 0 300 370"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
       
      >
        <rect width="300" height="370" rx="18" fill="#ecfdf5" />
        <rect width="300" height="370" rx="18" fill="url(#mintGradT)" opacity="0.4" />
        <defs>
          <linearGradient id="mintGradT" x1="0" y1="0" x2="300" y2="370">
            <stop stop-color="#d1fae5" />
            <stop offset="1" stop-color="#a7f3d0" />
          </linearGradient>
        </defs>

        <rect x="20" y="30" width="260" height="320" rx="14" fill="#ffffff" fill-opacity="0.88" stroke="#d1fae5" />

        
        <text x="150" y="98" font-family="var(--font-sora), sans-serif" font-size="17" font-weight="700" fill="#1a1a2e" text-anchor="middle">Join a Session</text>
        <text x="150" y="114" font-family="var(--font-sora), sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Enter the code shown by your host</text>

        <text x="40" y="140" font-family="var(--font-sora), sans-serif" font-size="8" font-weight="700" fill="#6b7280" letter-spacing="1.5">SESSION CODE</text>
        <rect x="36" y="146" width="228" height="40" rx="10" fill="#f9fafb" stroke="#e5e7eb" />
        <text x="150" y="173" font-family="var(--font-sora), sans-serif" font-size="20" font-weight="800" fill="#1a1a2e" text-anchor="middle" letter-spacing="10">2UU6SV</text>

        <text x="40" y="206" font-family="var(--font-sora), sans-serif" font-size="8" font-weight="700" fill="#6b7280" letter-spacing="1.5">YOUR NAME</text>
        <text x="115" y="206" font-family="var(--font-sora), sans-serif" font-size="8" fill="#64748b">(optional)</text>
        <rect x="36" y="212" width="228" height="34" rx="10" fill="#f9fafb" stroke="#e5e7eb" />
        <text x="52" y="234" font-family="var(--font-sora), sans-serif" font-size="11" fill="#64748b">Anonymous</text>

        <text x="40" y="266" font-family="var(--font-sora), sans-serif" font-size="8" font-weight="700" fill="#6b7280" letter-spacing="1.5">TRANSLATION LANGUAGE</text>
        <rect x="36" y="272" width="228" height="34" rx="10" fill="#f9fafb" stroke="#e5e7eb" />
        <text x="52" y="294" font-family="var(--font-sora), sans-serif" font-size="11" fill="#374151">Spanish (Latin America)</text>
        

        <rect x="36" y="316" width="228" height="40" rx="12" fill="#087f5b" />
        <text x="150" y="341" font-family="var(--font-sora), sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Join Session</text>
      </svg>