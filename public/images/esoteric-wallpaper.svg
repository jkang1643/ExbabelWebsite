<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Intense Glowing Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#FEF08A" />
    </linearGradient>

    <!-- Bloom / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Seed of Life Pattern -->
    <g id="seed" fill="none" stroke="url(#gold)" stroke-width="2.5">
      <circle cx="0" cy="0" r="50" />
      <circle cx="0" cy="-50" r="50" />
      <circle cx="43.3" cy="-25" r="50" />
      <circle cx="43.3" cy="25" r="50" />
      <circle cx="0" cy="50" r="50" />
      <circle cx="-43.3" cy="25" r="50" />
      <circle cx="-43.3" cy="-25" r="50" />
      <circle cx="0" cy="0" r="100" />
      <circle cx="0" cy="0" r="105" stroke-width="1" />
    </g>

    <!-- Eye of Providence (Pyramid) -->
    <g id="pyramid" fill="none" stroke="url(#gold)" stroke-width="2.5">
      <polygon points="0,-120 103.9,60 -103.9,60" />
      <polygon points="0,-130 112.6,65 -112.6,65" stroke-width="1" />
      <path d="M-30,10 Q0,-15 30,10 Q0,35 -30,10 Z" />
      <circle cx="0" cy="10" r="10" />
      <circle cx="0" cy="10" r="4" fill="url(#gold)" />
      <g stroke-width="2">
        <line x1="0" y1="-140" x2="0" y2="-170" />
        <line x1="30" y1="-135" x2="50" y2="-160" />
        <line x1="-30" y1="-135" x2="-50" y2="-160" />
        <line x1="60" y1="-115" x2="90" y2="-135" />
        <line x1="-60" y1="-115" x2="-90" y2="-135" />
      </g>
    </g>

    <!-- Complex Hexagram / Metatron's Cube core -->
    <g id="hexagram" fill="none" stroke="url(#gold)" stroke-width="3">
      <circle cx="0" cy="0" r="150" />
      <circle cx="0" cy="0" r="140" stroke-width="1" stroke-dasharray="8 8" />
      <circle cx="0" cy="0" r="75" />
      
      <polygon points="0,-150 129.9,75 -129.9,75" />
      <polygon points="0,150 129.9,-75 -129.9,-75" />
      
      <!-- Dots -->
      <circle cx="0" cy="-150" r="10" fill="url(#gold)" />
      <circle cx="129.9" cy="75" r="10" fill="url(#gold)" />
      <circle cx="-129.9" cy="75" r="10" fill="url(#gold)" />
      <circle cx="0" cy="150" r="10" fill="url(#gold)" />
      <circle cx="129.9" cy="-75" r="10" fill="url(#gold)" />
      <circle cx="-129.9" cy="-75" r="10" fill="url(#gold)" />
      <circle cx="0" cy="0" r="15" fill="url(#gold)" />
      
      <!-- Inner lines -->
      <line x1="0" y1="-150" x2="0" y2="150" />
      <line x1="-129.9" y1="-75" x2="129.9" y2="75" />
      <line x1="-129.9" y1="75" x2="129.9" y2="-75" />
    </g>

    <!-- Filigree / Circuit lines -->
    <g id="filigree" fill="none" stroke="url(#gold)" stroke-width="3">
      <polyline points="0,0 100,0 150,50 150,150" stroke-linejoin="round" />
      <polyline points="20,0 80,0 120,40 120,120" stroke-width="1.5" stroke-linejoin="round" />
      <polyline points="150,150 150,200 100,250 0,250" stroke-linejoin="round" />
      <circle cx="150" cy="150" r="15" />
      <circle cx="150" cy="150" r="5" fill="url(#gold)" />
    </g>

    <!-- Crescent Moon -->
    <g id="moon" fill="url(#gold)">
      <path d="M 0,-30 A 30,30 0 1,1 0,30 A 20,20 0 1,0 0,-30 Z" />
    </g>
    <!-- Star -->
    <g id="star" fill="url(#gold)">
      <polygon points="0,-15 4,-4 15,-4 6,4 10,15 0,8 -10,15 -6,4 -15,-4 -4,-4" />
    </g>
  </defs>

  <rect width="1000" height="1000" fill="transparent" />

  <!-- Wraps everything in the glow filter -->
  <g filter="url(#glow)">
    <use href="#hexagram" x="500" y="500" transform="scale(1.4)" />
    
    <use href="#pyramid" x="500" y="200" transform="scale(1.1)" />
    <use href="#pyramid" x="500" y="800" transform="rotate(180 500 800) scale(1.1)" />

    <use href="#seed" x="200" y="500" transform="scale(1.3)" />
    <use href="#seed" x="800" y="500" transform="scale(1.3)" />

    <!-- Corners (circuit style) -->
    <use href="#filigree" x="50" y="50" />
    <use href="#filigree" x="950" y="50" transform="scale(-1, 1) translate(-1000, 0)" />
    <use href="#filigree" x="50" y="950" transform="scale(1, -1) translate(0, -1000)" />
    <use href="#filigree" x="950" y="950" transform="scale(-1, -1) translate(-1000, -1000)" />

    <!-- Moons & Stars -->
    <use href="#moon" x="250" y="250" transform="rotate(-45 250 250)" />
    <use href="#moon" x="750" y="750" transform="rotate(135 750 750)" />
    
    <use href="#star" x="350" y="150" />
    <use href="#star" x="150" y="350" />
    <use href="#star" x="850" y="650" />
    <use href="#star" x="650" y="850" />
    <use href="#star" x="250" y="750" />
    <use href="#star" x="750" y="250" />

    <!-- Circuit/Esoteric Connections -->
    <g stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <polyline points="50,500 150,500 250,400 250,250" />
      <polyline points="950,500 850,500 750,400 750,250" />
      <polyline points="50,500 150,500 250,600 250,750" />
      <polyline points="950,500 850,500 750,600 750,750" />
      
      <!-- Diamond frame -->
      <polygon points="500,80 880,500 500,920 120,500" stroke-width="1.5" stroke-dasharray="15 15" />
    </g>
  </g>
</svg>
