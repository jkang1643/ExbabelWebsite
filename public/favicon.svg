<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="60%" stop-color="#394DFE"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base with 26% radius -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Minimalist Geometric Soundwave / "E" Monogram -->
  <!-- Left Vertical Spine -->
  <rect x="132" y="132" width="56" height="248" rx="28" fill="#FFFFFF"/>
  
  <!-- Top Soundwave Bar -->
  <rect x="176" y="132" width="204" height="56" rx="28" fill="#FFFFFF"/>
  
  <!-- Middle Soundwave Frequency Bar (Electric Cyan/Mint) -->
  <rect x="176" y="228" width="136" height="56" rx="28" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Dynamic Speech Dot / Translation Spark -->
  <circle cx="360" cy="256" r="28" fill="#00F5A0" filter="url(#glow)"/>
  
  <!-- Bottom Soundwave Bar -->
  <rect x="176" y="324" width="204" height="56" rx="28" fill="#FFFFFF"/>
</svg>