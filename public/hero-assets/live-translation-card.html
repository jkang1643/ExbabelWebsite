<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exbabel SVG Asset</title>
<style>
  body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .container { width: 100%; max-width: 900px; padding: 20px; display: flex; justify-content: center; }
  :root { --font-sora: 'Sora'; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<svg
        viewBox="0 0 240 150"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        style="position: absolute; right: -5%; top: 40%; width: 28%; height: auto; filter: drop-shadow(0 20px 40px rgba(0; transform: perspective(800px) rotateY(-10deg) rotateX(2deg)"
      >
        <rect width="240" height="150" rx="16" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" />
        <circle cx="20" cy="24" r="3" fill="#059669" />
        <text x="30" y="28" font-family="var(--font-sora), sans-serif" font-size="10" font-weight="600" fill="#64748b">Live translation</text>
        
        <text x="30" y="65" font-family="var(--font-sora), sans-serif" font-size="14" font-weight="600" fill="#0f172a">English</text>
        <text x="90" y="64" font-family="var(--font-sora), sans-serif" font-size="12" fill="#94a3b8">→</text>
        <text x="115" y="65" font-family="var(--font-sora), sans-serif" font-size="14" font-weight="600" fill="#0f172a">Français</text>
        
        <text x="30" y="95" font-family="var(--font-sora), sans-serif" font-size="12" fill="#64748b">Everyone is welcome.</text>
        <text x="30" y="120" font-family="var(--font-sora), sans-serif" font-size="16" font-weight="500" fill="#4f46e5">Bienvenue à tous.</text>
      </svg>
</div>
</body>
</html>
