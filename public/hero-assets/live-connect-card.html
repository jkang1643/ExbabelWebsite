<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exbabel SVG Asset</title>
<style>
  body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .container { width: 100%; max-width: 900px; padding: 20px; display: flex; justify-content: center; }
  :root { --font-sora: 'Sora'; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<svg
        viewBox="0 0 320 280"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        style="position: absolute; left: -22%; top: 12%; width: 35%; height: auto; filter: drop-shadow(0 20px 40px rgba(0; transform: perspective(800px) rotateY(10deg) rotateX(2deg); z-index: 10"
      >
        <rect width="320" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        
        
        <text x="20" y="32" font-family="var(--font-sora), sans-serif" font-size="14" font-weight="700" fill="#0f172a">Connect Your Live Stream</text>
        <text x="20" y="48" font-family="var(--font-sora), sans-serif" font-size="9" fill="#64748b">Paste any livestream URL &#8212; Exbabel detects and connects automatically</text>
        
        <line x1="0" y1="64" x2="320" y2="64" stroke="#f1f5f9" stroke-width="1" />
        
        
        <rect x="20" y="80" width="280" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="32" y="101" font-family="var(--font-sora), sans-serif" font-size="11" fill="#cbd5e1">Paste a livestream URL...</text>
        
        <text x="20" y="130" font-family="var(--font-sora), sans-serif" font-size="7.5" fill="#94a3b8">Examples: youtube.com/live/... &#183; twitch.tv/... &#183; churchname.org/live</text>
        
        
        <text x="20" y="160" font-family="var(--font-sora), sans-serif" font-size="8" font-weight="700" fill="#64748b">SUPPORTS 1,800+ STREAMING PLATFORMS</text>
        
        
        <rect x="20" y="172" width="65" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="32" cy="183" r="4" fill="#94a3b8" />
        <text x="40" y="186" font-family="var(--font-sora), sans-serif" font-size="9" font-weight="600" fill="#94a3b8">YouTube</text>
        
        <rect x="90" y="172" width="55" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <rect x="100" y="179" width="8" height="8" rx="2" fill="#94a3b8" />
        <text x="112" y="186" font-family="var(--font-sora), sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Twitch</text>
        
        <rect x="150" y="172" width="50" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <rect x="160" y="179" width="8" height="8" fill="#cbd5e1" />
        <text x="172" y="186" font-family="var(--font-sora), sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Kick</text>
        
        <rect x="205" y="172" width="55" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="215" cy="183" r="4" fill="#94a3b8" />
        <text x="223" y="186" font-family="var(--font-sora), sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Vimeo</text>
        
        
        <circle cx="26" cy="216" r="4.5" fill="none" stroke="#64748b" stroke-width="1" />
        <line x1="26" y1="213" x2="26" y2="219" stroke="#64748b" stroke-width="1" />
        <line x1="23" y1="216" x2="29" y2="216" stroke="#64748b" stroke-width="1" />
        <text x="38" y="219" font-family="var(--font-sora), sans-serif" font-size="9" font-weight="600" fill="#475569">View all 1,800+ supported platforms</text>
        
        
        <rect x="20" y="234" width="280" height="34" rx="6" fill="#94a3b8" />
        <path d="M110 248 A 6 6 0 0 1 118 248 M107 245 A 10 10 0 0 1 121 245" stroke="#ffffff" stroke-width="1" fill="none" />
        <circle cx="114" cy="252" r="1.5" fill="#ffffff" />
        <text x="126" y="254" font-family="var(--font-sora), sans-serif" font-size="11" font-weight="600" fill="#ffffff">Connect Stream</text>
      </svg>
</div>
</body>
</html>
