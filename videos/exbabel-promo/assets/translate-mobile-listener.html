<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exbabel SVG Asset</title>
<style>
  body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .container { width: 100%; max-width: 900px; padding: 20px; display: flex; justify-content: center; }
  :root { --font-sora: 'Sora'; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<svg
        viewBox="0 0 200 400"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        style="position: absolute; left: -5%; top: 12%; width: 23%; height: auto; filter: drop-shadow(0 30px 60px rgba(59; transform: perspective(800px) rotateY(12deg) rotateX(2deg)"
      >
        
        <rect width="200" height="400" rx="20" fill="#0a1628" stroke="#1e293b" stroke-width="2" />

        
        <rect x="12" y="12" width="48" height="20" rx="6" fill="#1e293b" />
        <text x="36" y="26" font-family="var(--font-sora), sans-serif" font-size="8" font-weight="600" fill="#e2e8f0" text-anchor="middle">2UU6SV</text>

        <rect x="64" y="12" width="28" height="20" rx="6" fill="#1e293b" />
        <text x="78" y="26" font-family="var(--font-sora), sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">S2S</text>

        <rect x="96" y="12" width="70" height="20" rx="6" fill="#1e293b" />
        <text x="131" y="26" font-family="var(--font-sora), sans-serif" font-size="7" fill="#e2e8f0" text-anchor="middle">Spanish...</text>

        
        <circle cx="174" cy="22" r="3" fill="#10b981" />
        <text x="174" y="40" font-family="var(--font-sora), sans-serif" font-size="6" fill="#10b981" text-anchor="middle">ACTIVE</text>

        
        <rect x="8" y="50" width="184" height="300" rx="10" fill="#0f172a" />

        
          <style>
            @keyframes charAppear {
              0% { opacity: 0; }
              100% { opacity: 1; }
            }
          </style>
          <g key=0>
              <text x="20" y="160" fill="#94a3b8" font-size="11" font-family="var(--font-sora), sans-serif">Live Translation:</text>
      
              {currentMessage.map((line, i) => (
                <TypewriterText key=0 x="20" y=0 font-family="var(--font-sora), sans-serif" font-size="12" font-weight="700" fill="#10b981" text=0 delayOffset=0 />
              ))}
            </g>
  
          
        <rect x="8" y="356" width="184" height="36" rx="10" fill="#111827" />
        <rect x="16" y="364" width="4" height="16" rx="2" fill="#10b981" opacity="0.5" />
        <rect x="22" y="368" width="4" height="8" rx="2" fill="#10b981" opacity="0.7" />
        <rect x="28" y="362" width="4" height="20" rx="2" fill="#10b981" />
        <rect x="34" y="366" width="4" height="12" rx="2" fill="#10b981" opacity="0.6" />
        <text x="46" y="377" font-family="var(--font-sora), sans-serif" font-size="7" fill="#94a3b8">Streaming Translated Audio</text>

        <rect x="130" y="365" width="54" height="18" rx="6" fill="#1e293b" />
        <text x="157" y="378" font-family="var(--font-sora), sans-serif" font-size="7" fill="#e2e8f0" text-anchor="middle">Multi Voice</text>
      </svg>
</div>
</body>
</html>
