<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Sora';
      src: url('assets/Sora.ttf') format('truetype');
      font-weight: 100 800;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Sora', sans-serif;
      background: #FCFCFD;
    }
    .scene {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Camera wrapper for product-focus zoom */
    .camera-viewport {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform-origin: center center;
    }
    /* Brand colors */
    :root {
      --blue: #4338ca;
      --ink: #1a1a2e;
      --emerald: #10b981;
      --bg: #FCFCFD;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
    }
    .headline {
      font-size: 48px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      line-height: 1.3;
      max-width: 1200px;
    }
    .subline {
      font-size: 24px;
      font-weight: 400;
      color: var(--gray-500);
      text-align: center;
      max-width: 900px;
      margin-top: 16px;
    }
    .brand-mark {
      width: 64px;
      height: 64px;
    }
    /* UI embed container */
    .ui-frame {
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(37, 75, 217, 0.12),
                  0 8px 20px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      background: #fff;
    }
    /* Fade-in utility */
    .fade-element {
      opacity: 0;
      transform: translateY(20px);
    }
  </style>
</head>
<body>
  <div id="S02-root"
       data-composition-id="S02"
       data-width="1920"
       data-height="1080"
       data-duration="5.25"
       style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#FCFCFD;">


  <div class="scene" style="flex-direction: column; gap: 24px;">
    <div id="church-motif" class="fade-element" style="position:relative; width:600px; height:400px;">
      <svg viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
        <!-- Church entrance -->
        <rect x="150" y="80" width="300" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
        <rect x="240" y="200" width="50" height="80" rx="4" fill="var(--blue)" opacity="0.15"/>
        <rect x="310" y="200" width="50" height="80" rx="4" fill="var(--blue)" opacity="0.15"/>
        <!-- Cross -->
        <rect x="293" y="100" width="14" height="60" rx="2" fill="var(--blue)" opacity="0.3"/>
        <rect x="275" y="118" width="50" height="14" rx="2" fill="var(--blue)" opacity="0.3"/>
        <!-- Family silhouettes walking in -->
        <circle id="person1" cx="380" cy="320" r="16" fill="var(--ink)" opacity="0.6"/>
        <rect x="370" y="340" width="20" height="35" rx="6" fill="var(--ink)" opacity="0.5"/>
        <circle id="person2" cx="420" cy="315" r="18" fill="var(--ink)" opacity="0.7"/>
        <rect x="408" y="337" width="24" height="38" rx="7" fill="var(--ink)" opacity="0.6"/>
        <circle id="person3" cx="455" cy="330" r="12" fill="var(--ink)" opacity="0.5"/>
        <rect x="447" y="346" width="16" height="28" rx="5" fill="var(--ink)" opacity="0.4"/>
      </svg>
    </div>
    <div class="subline fade-element" id="subtitle" style="font-size:20px;color:var(--gray-500);">
      Picture someone walking into your service this Sunday with their family.
    </div>
  </div>

  <script src="assets/anime.umd.min.js"></script>
  <script>
    'use strict';
    const tl = anime.createTimeline({
      autoplay: false,
      easing: 'easeOutCubic'
    });
    
    tl.add('#church-motif', { opacity: [0,1], translateY: [30,0], duration: 700 }, 0)
      tl.add('#person1, #person2, #person3', { translateX: [-40, 0], opacity: [0.2, 0.7], duration: 1200, easing: 'easeOutQuad' }, 300)
      tl.add('#subtitle', { opacity: [0,1], translateY: [15,0], duration: 600 }, 800);
    
    window.__timelines = window.__timelines || {};
    window.__timelines[document.body.dataset.compositionId] = {
      seek: (ms) => tl.seek(ms),
      duration: 5250
    };
    if (typeof window.storyboardTimeline === 'undefined') {
      window.storyboardTimeline = { seek: (ms) => tl.seek(ms) };
    }
  </script>

  </div>
</body>
</html>
