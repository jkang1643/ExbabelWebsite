<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Sora';
      src: url('assets/Sora.ttf') format('truetype');
      font-weight: 100 800;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Sora', sans-serif;
      background: #FCFCFD;
    }
    .scene {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Camera wrapper for product-focus zoom */
    .camera-viewport {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform-origin: center center;
    }
    /* Brand colors */
    :root {
      --blue: #4338ca;
      --ink: #1a1a2e;
      --emerald: #10b981;
      --bg: #FCFCFD;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
    }
    .headline {
      font-size: 48px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      line-height: 1.3;
      max-width: 1200px;
    }
    .subline {
      font-size: 24px;
      font-weight: 400;
      color: var(--gray-500);
      text-align: center;
      max-width: 900px;
      margin-top: 16px;
    }
    .brand-mark {
      width: 64px;
      height: 64px;
    }
    /* UI embed container */
    .ui-frame {
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(37, 75, 217, 0.12),
                  0 8px 20px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      background: #fff;
    }
    /* Fade-in utility */
    .fade-element {
      opacity: 0;
      transform: translateY(20px);
    }
  </style>
</head>
<body>
  <div id="S19-root"
       data-composition-id="S19"
       data-width="1920"
       data-height="1080"
       data-duration="6.567"
       style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#FCFCFD;">

  <div class="scene" style="flex-direction: column; gap: 28px;">
    <div class="headline fade-element" id="line0" style="font-size:36px;">If this sounds useful for [Church Name],</div>
    <div class="headline fade-element" id="line1" style="font-size:44px; color:var(--blue); font-weight:700;">I'd love for you to actually try it</div>
    <div class="headline fade-element" id="line2" style="font-size:36px;">during a service.</div>
  </div>

  <script src="assets/anime.umd.min.js"></script>
  <script>
    'use strict';
    const tl = anime.createTimeline({
      autoplay: false,
      easing: 'easeOutCubic'
    });
        tl.add("#line0", { opacity: [0,1], translateY: [20,0], duration: 700 }, 0);
    tl.add("#line1", { opacity: [0,1], translateY: [20,0], duration: 700 }, 800);
    tl.add("#line2", { opacity: [0,1], translateY: [20,0], duration: 700 }, 1600);

    window.__timelines = window.__timelines || {};
    window.__timelines[document.body.dataset.compositionId] = {
      seek: (ms) => tl.seek(ms),
      duration: 6567
    };
    if (typeof window.storyboardTimeline === 'undefined') {
      window.storyboardTimeline = { seek: (ms) => tl.seek(ms) };
    }
  </script>

  </div>
</body>
</html>
